# systemd drop-in for fprintd on dual-boot machines: Windows provisions its own
# PSK on the sensor, so let the driver write the Linux (all-zero) PSK back on
# the first use after a Windows boot. Windows Hello keeps working because
# Windows re-provisions on its side as well.
#
# Install: sudo cp goodix5503-psk.conf /etc/systemd/system/fprintd.service.d/
#          sudo systemctl daemon-reload && sudo systemctl restart fprintd
[Service]
Environment=GOODIX5503_ALLOW_PSK_WRITE=1
